openapi: 3.0.3
info:
  title: Laravel DDD API
  description: DDD-structured Laravel API for Cars, Users, Orders, Products, AuditLog, Invoices, Payments, and Notifications
  version: 1.0.0
  contact:
    name: Rasim Aghayev
    email: security@rasimaghayev.com
servers:
  - url: /api/v1
    description: Local development server
paths:
  /cars:
    get:
      summary: List cars
      responses:
        '200':
          description: OK
    post:
      summary: Create a car
      responses:
        '201':
          description: Created
  /cars/{id}:
    get:
      summary: Get a car
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '404':
          description: Not found
    put:
      summary: Update a car
      parameters:
        - in: path
          name: id
          required: true
