name: "laravel_ddd"

networks:
  laravel_ddd:
    name: laravel_ddd

services:
  nginx:
    build:
      context: ..
      dockerfile: server/nginx/Dockerfile
      target: runtime
    container_name: nginx
    depends_on:
      php:
        condition: service_healthy
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_PORT_SSL:-443}:443"
    volumes:
      - ../src:/var/www/html:delegated
    networks:
      - laravel_ddd
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  php:
    build:
      context: ..
      dockerfile: server/php/Dockerfile
      target: runtime
    container_name: php
    volumes:
      - ../src/be:/var/www/html/be
    networks:
      - laravel_ddd
    healthcheck:
      test: ["CMD", "pgrep", "-x", "php-fpm"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  composer:
    build:
      context: ..
      dockerfile: server/composer/Dockerfile
      target: runtime
    container_name: composer
    volumes:
      - ../src/be:/var/www/html/be
    working_dir: /var/www/html/be
    networks:
      - laravel_ddd

  artisan:
    build:
      context: ..
      dockerfile: server/php/Dockerfile
      target: test
    container_name: artisan
    volumes:
      - ../src/be:/var/www/html/be
    working_dir: /var/www/html/be
    entrypoint: ["php", "artisan"]
    depends_on:
      php:
        condition: service_healthy
      pgsql:
        condition: service_healthy
    networks:
      - laravel_ddd

  phpunit:
    build:
      context: ..
      dockerfile: server/php/Dockerfile
      target: test
    container_name: phpunit
    volumes:
      - ../src/be:/var/www/html/be
    working_dir: /var/www/html/be
    entrypoint: ["/var/www/html/be/vendor/bin/phpunit"]
    depends_on:
      php:
        condition: service_healthy
      pgsql:
        condition: service_healthy
    networks:
      - laravel_ddd

  pgsql:
    image: postgres:16-alpine
    container_name: pgsql
    restart: always
    shm_size: 128mb
    ports:
      - 6432:5432
    volumes:
      - ../db/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=laravel
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
    networks:
      - laravel_ddd
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d laravel"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: redis
    command: redis-server --requirepass root --save 20 1 --loglevel warning
    environment:
      - REDIS_PASSWORD=root
    ports:
      - "8002:6379"
    volumes:
      - ../db/redis:/data
    networks:
      - laravel_ddd
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "root", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
